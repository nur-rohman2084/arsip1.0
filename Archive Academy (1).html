.pd{background:rgba(6,14,42,.8);border:1px solid rgba(60,95,180,.45);border-radius:16px}
.ol{-webkit-text-stroke:7px #2f3f8c;paint-order:stroke fill;color:#e3e9ff;text-shadow:0 4px 0 #1b2560}

<div className="my-4 flex flex-wrap items-center gap-3"><select aria-label="Kelas" className="pd bg-[#0b183f] px-3 py-2 text-sm"><option>Kelas X IPA 1</option></select><span className="mr-auto text-xs text-blue-200">32 siswa • Tahun ajaran 2025/2026</span><button onClick={()=>say("Impor Excel segera hadir.")} className="pd flex items-center gap-2 px-4 py-2 text-sm"><I n="file" c="w-4 h-4"/>Impor Excel</button><Gb onClick={()=>say("Ekspor Excel dimulai (simulasi).")} cls="!rounded-lg !py-2 text-sm !font-sans font-bold">Ekspor Excel</Gb></div>
<div className="grid gap-4 xl:grid-cols-[1fr_300px]"><div className="pn p-5"><div className="mb-3 flex flex-wrap items-center gap-3"><h2 className="hd mr-auto text-2xl">Daftar Siswa</h2><Chip t="● 32 siswa"/></div><div className="mb-3 flex gap-3"><label className="pd flex flex-1 items-center gap-2 px-3"><I n="find" c="w-4 h-4"/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Cari nama atau nomor siswa..." className="w-full bg-transparent py-2.5 text-sm"/></label><select value={f} onChange={e=>setF(e.target.value)} aria-label="Filter status" className="pd bg-[#0b183f] px-3 text-sm">{["Semua Status","Aktif","Nonaktif"].map(o=><option key={o}>{o}</option>)}</select></div>
<div className="overflow-x-auto"><table className="w-full min-w-[560px] text-left text-sm"><thead className="text-[11px] text-blue-300"><tr><th className="py-2">No.</th><th>Nama Siswa</th><th>Kelas</th><th>Nilai</th><th>Progres</th><th>Status</th></tr></thead><tbody>{rows.map(({r:x,i})=><tr key={x[0]} onClick={()=>setSel(i)} className={`cursor-pointer border-t border-white/10 ${sel===i?"bg-white/10":"hover:bg-white/5"}`}><td className="py-2 text-blue-300">{i+1}</td><td><span className="mr-2 inline-flex h-7 w-7 items-center justify-center rounded-lg bg-[#2a4a9a] text-[10px] font-bold">{ini(x[0])}</span><b>{x[0]}</b></td><td className="text-xs">X IPA 1</td><td><b>{x[1].toFixed(1)}</b></td><td className="w-28"><span className="text-[10px]">{x[2]}%</span><Bar v={x[2]} h="h-1.5"/></td><td><Chip t={"● "+(x[3]?"Aktif":"Nonaktif")} g={!!x[3]}/></td></tr>)}</tbody></table>{!rows.length&&<p className="py-6 text-center text-blue-300">Tidak ada siswa yang cocok.</p>}</div>
<div className="mt-3 flex items-center justify-between text-xs text-blue-200"><span>Menampilkan 1-8 dari 32 siswa</span><div className="flex gap-1">{[1,2,3,4].map(p=><button key={p} onClick={()=>{setPg(p);if(p>1)say("Data contoh hanya tersedia di halaman 1.")}} className={`h-7 w-7 rounded-md ${pg===p?"gb !rounded-md !shadow-none":"bg-white/10"}`}>{p}</button>)}</div></div></div>
<aside className="pn p-5 text-center"><div className="flex justify-between"><h3 className="hd text-2xl">Detail Siswa</h3><button onClick={()=>setSel(0)} aria-label="Reset" className="text-blue-300">✕</button></div><div className="hd mx-auto mt-3 flex h-20 w-20 items-center justify-center rounded-2xl border-2 border-[#4a6fc8] bg-[#1b3274] text-3xl">{ini(r[0])}</div><p className="hd mt-2 text-2xl">{r[0]}</p><p className="text-xs text-blue-200">Kelas X IPA 1 • No. absen {String(sel+1).padStart(2,"0")}</p><div className="mt-1"><Chip t={r[3]?"● Siswa Aktif":"● Nonaktif"} g={!!r[3]}/></div>
<div className="mt-3 grid grid-cols-2 gap-2"><div className="pd p-2"><p className="text-[10px] text-blue-300">Total Nilai</p><p className="hd text-3xl">{r[1].toFixed(1)}</p></div><div className="pd p-2"><p className="text-[10px] text-blue-300">Progres</p><p className="hd text-3xl">{r[2]}%</p></div></div>
<p className="mt-3 border-t border-white/10 pt-3 text-left text-sm font-bold">Lencana yang Diperoleh</p><div className="mt-2 flex justify-around text-2xl" aria-hidden="true"><span>🏆</span><span>⚡</span><span>🛡️</span></div>
<p className="mt-3 text-left text-sm font-bold">Aktivitas Terakhir</p><p className="text-left text-xs text-blue-200">Menyelesaikan kuis Turret Laser dengan nilai 95.</p><button onClick={()=>say("Riwayat lengkap segera hadir.")} className="pd mt-3 w-full py-2 text-sm">→ Lihat Riwayat Lengkap</button></aside></div></TS>}

function TLap({go,logout,say}){
const [f,setF]=useState({p:"Oktober 2025",k:"Kelas X IPA 1",j:"Nilai Siswa",t:"Semua Turret"});
const O={p:["Oktober 2025","September 2025"],k:["Kelas X IPA 1","Kelas X IPS 1","Kelas XI IPA 2"],j:["Nilai Siswa","Progres Kelas","Aktivitas Turret"],t:["Semua Turret",...TUR.map(x=>x[0])]};
const L=[["Laporan Nilai Siswa","XLSX • 24 KB"],["Laporan Progres Kelas","XLSX • 18 KB"],["Laporan Aktivitas Turret","XLSX • 32 KB"],["Rekap Hasil Belajar","PDF • 146 KB"]];
return <TS cur="tLap" go={go} logout={logout}><TH t="Laporan" s="Pantau perkembangan kelas dan unduh laporan pembelajaran." say={say}/>
<div className="mb-4 flex flex-wrap items-end gap-3">{[["p","Periode"],["k","Kelas"],["j","Jenis Laporan"],["t","Turret"]].map(([k,l])=><label key={k} className="min-w-[140px] flex-1 text-[11px] text-blue-200">{l}<select value={f[k]} onChange={e=>setF({...f,[k]:e.target.value})} className="pd mt-1 w-full bg-[#0b183f] px-3 py-2.5 text-sm text-white">{O[k].map(o=><option key={o}>{o}</option>)}</select></label>)}<Gb onClick={()=>say(`Laporan ${f.j} • ${f.k} dibuat.`)} cls="!rounded-lg !py-2.5 text-sm !font-sans font-bold">Buat Laporan</Gb></div><TStats/>
<div className="mt-4 grid gap-4 lg:grid-cols-[1.7fr_1fr]"><div className="space-y-4"><div className="pn p-5"><div className="flex flex-wrap justify-between gap-2"><h2 className="hd text-2xl">Grafik Perkembangan</h2><Chip t="● 7 Hari Terakhir"/></div><Leg/><Line a={[68,72,79,83,84,86,87.5]} b={[72,78,81,85,85,87,87]} lab={["21 Okt","22 Okt","23 Okt","24 Okt","25 Okt","26 Okt","27 Okt"]}/><p className="text-xs text-emerald-300">↗ Nilai rata-rata naik 1.2 poin dibanding periode sebelumnya.</p></div>
<div className="pn p-5"><h2 className="hd text-2xl">Ringkasan Kelas</h2><div className="mt-3 grid gap-3 sm:grid-cols-3">{[["isl1","Kelas X IPA 1","32 siswa",87],["isl2","Kelas X IPS 1","30 siswa",75],["isl3","Kelas XI IPA 2","28 siswa",60]].map(([im,n,s,v])=><div key={n} className="flex items-center gap-2"><Img n={im} c="h-11 w-11 rounded-lg"/><div className="flex-1"><p className="text-xs font-bold">{n}</p><p className="text-[10px] text-blue-200">{s} • {v}%</p><Bar v={v} h="h-1.5"/></div></div>)}</div></div></div>
<div className="space-y-4"><div className="pn p-5"><h2 className="hd text-2xl">Unduh Laporan</h2><p className="mb-2 text-xs text-blue-200">Unduh laporan kelas dalam Excel atau PDF.</p>{L.map(([t,s])=><div key={t} className="flex items-center gap-3 border-t border-white/10 py-2.5"><span className="flex h-9 w-9 items-center justify-center rounded-lg bg-[#1b3274]"><I n="file" c="w-4 h-4 text-emerald-300"/></span><div className="mr-auto"><p className="text-sm font-bold">{t}</p><p className="text-[10px] text-blue-300">{s}</p></div><button onClick={()=>say(`${t} diunduh (simulasi).`)} aria-label={"Unduh "+t} className="text-[#ffc82c]"><I n="dl"/></button></div>)}<button onClick={()=>say("Riwayat ekspor kosong.")} className="pd mt-2 w-full py-2 text-sm">Lihat Riwayat Ekspor</button></div>
<div className="pn p-5"><h2 className="hd text-2xl">✨ Langkah Berikutnya</h2><p className="mt-2 text-xs text-blue-100">4 siswa belum selesai belajar. Berikan pendampingan agar semua siswa siap ke turret berikutnya.</p><button onClick={()=>go("tSiswa")} className="mt-2 text-xs font-bold text-[#ffc82c]">Lihat siswa yang perlu dibantu →</button></div></div></div></TS>}

function TSet({go,logout,say}){
const [f,setF]=useState({n:"Bu Rina",u:"rina.guru",e:"rina@archive.academy",s:"SMA Archive Nusantara",m:"75"});
const [t,setT]=useState({a:true,b:true,c:false,d:true,v:true});
const s=k=>e=>setF({...f,[k]:e.target.value});
const In=({k,l,tp})=><label className="text-[11px] text-blue-200">{l}<input type={tp} value={f[k]} onChange={s(k)} className="pd mt-1 w-full px-3 py-2.5 text-sm text-white"/></label>;
const Row=({k,t1,d})=><div className="flex items-center gap-3 border-b border-white/10 py-3"><div className="mr-auto"><p className="text-sm font-bold">{t1}</p><p className="text-[11px] text-blue-300">{d}</p></div><Tog on={t[k]} set={v=>setT({...t,[k]:v})} l={t1}/></div>;
return <TS cur="tSet" go={go} logout={logout}><TH t="Pengaturan" s="Sesuaikan profil dan ruang mengajar agar nyaman untuk Bu Rina." say={say}/>
<div className="grid gap-4 lg:grid-cols-[1.4fr_1fr]"><div className="space-y-4"><div className="pn p-5"><h2 className="hd mb-3 text-2xl">Profil Guru</h2><div className="mb-3 flex items-center gap-3"><Img n="tav" c="h-14 w-14 rounded-xl border-2 border-[#4a6fc8] object-cover"/><div className="mr-auto"><p className="font-bold">Bu Rina</p><p className="text-[11px] text-blue-300">JPG atau PNG, maksimal 2 MB.</p></div><button onClick={()=>say("Ubah foto segera hadir.")} className="pd px-3 py-2 text-xs">Ubah Foto</button></div><div className="grid gap-3 sm:grid-cols-2"><In k="n" l="Nama Lengkap"/><In k="u" l="Nama Pengguna"/><In k="e" l="Alamat Surel" tp="email"/><In k="s" l="Sekolah"/></div></div>
<div className="pn p-5"><h2 className="hd mb-3 text-2xl">Preferensi Mengajar</h2><div className="grid gap-3 sm:grid-cols-2"><label className="text-[11px] text-blue-200">Kelas Utama<select className="pd mt-1 w-full bg-[#0b183f] px-3 py-2.5 text-sm text-white"><option>Kelas X IPA 1</option></select></label><label className="text-[11px] text-blue-200">Mata Pelajaran<select className="pd mt-1 w-full bg-[#0b183f] px-3 py-2.5 text-sm text-white"><option>Informatika</option></select></label><In k="m" l="Nilai Ketuntasan Minimum"/><label className="text-[11px] text-blue-200">Bahasa Antarmuka<select className="pd mt-1 w-full bg-[#0b183f] px-3 py-2.5 text-sm text-white"><option>Bahasa Indonesia</option></select></label></div><Row k="d" t1="Buka turret berikutnya otomatis" d="Siswa dapat melanjutkan setelah mencapai nilai ketuntasan."/></div></div>
<div className="space-y-4"><div className="pn p-5"><h2 className="hd text-2xl">Preferensi Notifikasi</h2><Row k="a" t1="Aktivitas & pencapaian siswa" d="Kuis selesai, lencana baru, dan progres kelas."/><Row k="b" t1="Pengingat agenda mengajar" d="Ingatkan 30 menit sebelum kegiatan dimulai."/><Row k="c" t1="Ringkasan mingguan melalui surel" d="Kirim laporan perkembangan setiap Senin."/></div>
<div className="pn p-5"><h2 className="hd text-2xl">Keamanan Akun</h2><div className="flex items-center justify-between border-b border-white/10 py-3"><div><p className="text-sm font-bold">Kata Sandi</p><p className="text-[11px] text-blue-300">Terakhir diubah 12 Okt 2025</p></div><button onClick={()=>say("Ubah kata sandi segera hadir.")} className="pd px-4 py-1.5 text-xs">Ubah</button></div><Row k="v" t1="Verifikasi dua langkah" d="Lindungi akun dengan kode verifikasi tambahan."/></div></div></div>
<div className="pn mt-4 flex flex-wrap items-center justify-end gap-3 p-4"><span className="mr-auto text-xs text-blue-200">ⓘ Perubahan berlaku untuk akun dan kelas yang Bu Rina kelola.</span><button onClick={()=>say("Perubahan dibatalkan.")} className="pd px-5 py-2 text-sm">Batal</button><Gb onClick={()=>say("Perubahan tersimpan.")} cls="!rounded-lg !py-2 text-sm !font-sans font-bold">Simpan Perubahan</Gb></div></TS>}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
